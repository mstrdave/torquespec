[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torquespec"
version = "0.1.0"
description = "Diagnosis assistant and spec reference for the 1990 Mazda MX5 Miata, powered by Claude"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["anthropic>=2.8", "fastapi>=0.110", "pydantic>=2.5", "uvicorn>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
torquespec = "torquespec.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
torquespec = ["data/*.json", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
